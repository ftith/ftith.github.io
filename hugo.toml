baseURL = 'https://ftith.github.io/'
languageCode = "en-us"
title = "f.t"
theme = "macchiato"

[module]
  [module.hugoVersion]
    extended = true
    min = "0.123.0"

paginate = 6
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  author = "f.t"
  description = "This is my personal blog. I write about programming, technology, and other topics that interest me."
  tagline = "Welcome! (╯°□°）╯︵ ┻━┻"
  favicon = "favicon.svg"
  wideLayout = false

  [params.prompt]
    user = "f.t"
    # host = "stderr"
    # path = "~/blog"

  [params.social]
    github = "https://github.com/ftith/ftith.github.io"

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 8
  [[menu.main]]
    name = "Archives"
    url = "/archives/"
    weight = 9
  [[menu.main]]
    name = "Search"
    url = "/search/"
    weight = 10

  [[menu.footer]]
    name = "Home"
    url = "/"
    weight = 1

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
